name: surf-widget

on:
  schedule:
    - cron: "0 13 * * *"  # 06:00 America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate surf SVG
        run: python3 .github/surf-widget.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surf.svg
          git diff --cached --quiet || git commit -m "chore: update surf widget"
          git push
