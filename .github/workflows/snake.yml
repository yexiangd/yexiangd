name: Generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - name: Strip progress bar from snake SVG
        run: |
          python3 - <<'PYEOF'
          import re, glob
          for p in glob.glob('dist/*.svg'):
              svg = open(p).read()
              # remove the progress-bar rects (class "u")
              svg, n = re.subn(r'<rect\s+class="u\b[^>]*>', '', svg)
              # tighten the viewBox now the bar is gone
              svg = re.sub(r'viewBox="[^"]*"', 'viewBox="-16 -24 880 143"', svg, count=1)
              svg = re.sub(r'height="192"', 'height="143"', svg, count=1)
              open(p, 'w').write(svg)
              print(p, 'stripped rects:', n)
          PYEOF
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
