name: Generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - name: Strip progress bar from snake SVG
        id: strip
        continue-on-error: true
        run: |
          echo '=== pwd ===' > dist/diag.txt
          pwd >> dist/diag.txt 2>&1
          echo '=== .github ===' >> dist/diag.txt
          ls -la .github/ >> dist/diag.txt 2>&1
          echo '=== dist ===' >> dist/diag.txt
          ls -la dist/ >> dist/diag.txt 2>&1
          echo '=== python3 ===' >> dist/diag.txt
          which python3 >> dist/diag.txt 2>&1
          echo '=== run strip script ===' >> dist/diag.txt
          python3 .github/strip-progress.py >> dist/diag.txt 2>&1 || echo "PY_EXIT=$?" >> dist/diag.txt
          echo '=== done ===' >> dist/diag.txt
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
