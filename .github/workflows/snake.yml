name: Generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v4
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - name: Strip progress bar from snake SVG
        id: strip
        continue-on-error: true
        run: |
          {
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE";
          echo "PWD=$(pwd)";
          echo '--- workspace root ---'; ls -la "$GITHUB_WORKSPACE";
          echo '--- dist ---'; ls -la "$GITHUB_WORKSPACE/dist";
          echo '--- python ---'; which python3;
          echo '--- run strip ---'; python3 "$GITHUB_WORKSPACE/.github/strip-progress.py";
          echo "PY_EXIT=$?";
          } > "$GITHUB_WORKSPACE/dist/diag.txt" 2>&1
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
