name: Generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - name: Strip progress bar from snake SVG
        run: perl -0777 -pi -e 's/<rect[^>]*class="u[^"]*"[^>]*>//g; s/(<svg[^>]*?)viewBox="[^"]*"/$1viewBox="-16 -24 880 143"/; s/(<svg[^>]*?)height="192"/$1height="143"/' dist/*.svg
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
